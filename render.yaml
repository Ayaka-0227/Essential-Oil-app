services:
  - type: web
    name: essential-oil-app
    env: ruby
    plan: free
    repo: ./
    buildCommand: |
      bundle install
      RAILS_ENV=production bundle exec rake assets:precompile
      RAILS_ENV=production bundle exec rake assets:clean
    startCommand: bundle exec puma -C config/puma.rb
    # Optional: run migrations automatically on deploy
    releaseCommand: bin/rails db:migrate db:seed
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_APP_URL
        value: https://essential-oil-frontend.onrender.com
      - key: ADMIN_USER_EMAIL
        value: ayaka-1999.2.27song@ezweb.ne.jp
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: essential-oil-db
          property: connectionString

  - type: web
    name: essential-oil-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://essential-oil-app.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: essential-oil-db
    engine: postgres
    plan: free

# Notes:
# - Replace plan/repo/other fields as needed for your Render account.
# - Do NOT commit secrets like `config/master.key`. Instead set `RAILS_MASTER_KEY`
#   as an environment variable in Render settings.
