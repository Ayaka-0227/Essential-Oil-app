services:
  - type: web
    name: essential-oil-app
    env: ruby
    plan: free
    repo: ./
    buildCommand: |
      bundle install
      RAILS_ENV=production bundle exec rake assets:precompile
      RAILS_ENV=production bundle exec rake assets:clean
    startCommand: bundle exec puma -C config/puma.rb
    # Optional: run migrations automatically on deploy
    releaseCommand: bin/rails db:migrate
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: essential-oil-db
          property: connectionString

databases:
  - name: essential-oil-db
    engine: postgres
    plan: free

# Notes:
# - Replace plan/repo/other fields as needed for your Render account.
# - Do NOT commit secrets like `config/master.key`. Instead set `RAILS_MASTER_KEY`
#   as an environment variable in Render settings.
